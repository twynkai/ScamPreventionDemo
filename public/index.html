<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scam Prevention Demo</title>
    <!-- Inter Font for a modern fintech aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #e2e8f0;           /* Soft muted slate background (easy on eyes) */
            --card-bg: #f8fafc;            /* Warm off-white card background */
            --card-border: #cbd5e1;        /* Subtle border separation */
            --text-primary: #0f172a;       /* Dark slate readable text */
            --text-secondary: #475569;     /* Muted secondary text */
            --accent-blue: #0284c7;        /* Clean fintech accent */
            --radius-md: 8px;
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
        }

        html, body { 
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg-color) !important; 
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #root {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .modal { 
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0; 
            top: 0; 
            width: 100%; 
            height: 100%; 
            background-color: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(4px);
        }

        .modal.is-active { 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content { 
            background-color: var(--card-bg); 
            color: var(--text-primary);
            margin: auto; 
            padding: 24px; 
            width: 90%;
            max-width: 500px; 
            border: 1px solid var(--card-border); 
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
        }
    </style>
</head>
<body>
    <!-- React mounts your entire app inside this root div -->
    <div id="root"></div>

    <script type="module" src="telemetry.js"></script>
</body>
</html>
